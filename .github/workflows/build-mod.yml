name: Build Fabric mod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-action]') || contains(github.event.head_commit.message, '[build-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Build remapped Fabric jar
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace --info
      - uses: actions/upload-artifact@v4
        with:
          name: zyu-cobblemon-note-fabric-${{ github.sha }}
          path: |
            mod/build/libs/*.jar
            !mod/build/libs/*-sources.jar
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zyu-cobblemon-note-fabric-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.sha }}
          name: Zyu Cobblemon Note ${{ github.sha }}
          prerelease: true
          body_path: .github/release_template.md
          files: '*.jar'
