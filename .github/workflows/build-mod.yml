name: Build server artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-action]') || contains(github.event.head_commit.message, '[build-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Build remapped Fabric jar
        working-directory: mod
        run: |
          chmod +x gradlew
          ./gradlew build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Build Node gateway
        working-directory: gateway
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Validate and package MCDR plugin
        working-directory: mcdr
        run: |
          uv sync --group dev --python 3.12
          uv run python -m py_compile zyu_cobblemon_web/__init__.py build.py create_password_hash.py
          uv run python -c "import zyu_cobblemon_web; print('MCDR plugin import OK')"
          uv run python tests/smoke_server.py
          uv run python build.py
      - name: Assemble deployable server package
        run: |
          mkdir -p server-package/fabric server-package/gateway server-package/mcdr
          cp mod/build/libs/*.jar server-package/fabric/
          rm -f server-package/fabric/*-sources.jar
          cp gateway/package.json gateway/package-lock.json gateway/.env.example server-package/gateway/
          cp -R gateway/dist server-package/gateway/dist
          cp mcdr/dist/zyu-cobblemon-web-*.mcdr server-package/mcdr/
          node -e "const fs=require('fs'); fs.writeFileSync('server-package/manifest.json', JSON.stringify({commit: process.env.GITHUB_SHA, build: process.env.GITHUB_RUN_ID, artifacts:['fabric','gateway','mcdr']}, null, 2)+'\\n')"
          (cd server-package/gateway && zip -qr ../zyu-cobblemon-note-gateway.zip .)
          sha256sum server-package/fabric/*.jar server-package/mcdr/*.mcdr server-package/zyu-cobblemon-note-gateway.zip > server-package/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: zyu-cobblemon-note-server-${{ github.sha }}
          path: server-package
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: zyu-cobblemon-note-server-*
          merge-multiple: true
      - name: Render release notes with direct asset links
        env:
          RELEASE_TAG: test-${{ github.sha }}
        run: |
          node -e "const fs=require('fs'); const fabric=fs.readdirSync('fabric').find(name=>name.endsWith('.jar')); const mcdr=fs.readdirSync('mcdr').find(name=>name.endsWith('.mcdr')); if(!fabric || !mcdr) throw new Error('Release assets missing'); const template=fs.readFileSync('.github/release_template.md','utf8'); const rendered=template.replaceAll('{{RELEASE_TAG}}', process.env.RELEASE_TAG).replaceAll('{{FABRIC_ASSET}}', fabric).replaceAll('{{MCDR_ASSET}}', mcdr); fs.writeFileSync('release_notes.md', rendered);"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.sha }}
          name: Zyu Cobblemon Note ${{ github.sha }}
          prerelease: true
          body_path: release_notes.md
          files: |
            fabric/*.jar
            mcdr/*.mcdr
            zyu-cobblemon-note-gateway.zip
            manifest.json
            SHA256SUMS
